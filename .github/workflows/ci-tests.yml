name: CI tests

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: macOS-26
    strategy:
      matrix:
        python-version: [3.8]
        arch: [64]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
        env:
          # env for windows to install pycrypto; MSVC version may change
          CL: /FI"C:\\Program Files (x86)\\Microsoft Visual Studio\\2019\\Enterprise\\VC\\Tools\\MSVC\\14.24.28314\\INCLUDE\\stdint.h"

      # fluxclient/fluxsvg/beamify are not in requirements.txt; install the same
      # pinned refs the release build uses (see buildghost-win.yml).
      - name: Checkout Beamify
        uses: actions/checkout@v4
        with:
          repository: flux3dp/beamify
          ref: 2.1.0
          token: ${{ secrets.REPO_TOKEN }}
          path: .github/actions/beamify

      - name: Install Beamify
        uses: ./.github/actions/beamify

      - name: Install Fluxsvg
        uses: flux3dp/fluxsvg@2.7.7

      - name: Checkout FluxClient
        uses: actions/checkout@v4
        with:
          repository: flux3dp/fluxclient-dev
          ref: 2.9.12
          token: ${{ secrets.REPO_TOKEN }}
          path: .github/actions/fluxclient

      - name: Install FluxClient
        uses: ./.github/actions/fluxclient

      # fluxsvg -> cairocffi loads native cairo; the bundled DLLs live in lib/x64.
      - name: Install native libraries
        run: |
          brew install cairo
          # if ("${{ matrix.arch }}" -eq "32") {
          #   cp ./lib/x32/* C:\Windows\System32
          # } else {
          #   cp ./lib/x64/* C:\Windows\System32
          # }

      - name: Import smoke check
        run: python ghost.py --test

      - name: Websocket smoke suite
        shell: bash
        run: python tools/ws_smoke.py

      - name: Usage protocol tests
        shell: bash
        run: python -m unittest discover -s tests/usage -t . -v
